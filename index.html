<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lật sách</title>
<style>
  :root {
    --bg: #2b2f36;
    --bg2: #1f2228;
    --bar: rgba(20, 22, 27, .92);
    --fg: #eef0f3;
    --muted: #9aa1ad;
    --accent: #d9302c;
    --line: rgba(255,255,255,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at center, var(--bg) 0%, var(--bg2) 100%);
    color: var(--fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  header {
    position: fixed; inset: 0 0 auto 0; height: 48px;
    display: flex; align-items: center; gap: 12px; padding: 0 16px;
    background: var(--bar); border-bottom: 1px solid var(--line); z-index: 20;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  #stage {
    position: fixed; inset: 48px 0 56px 0;
    display: flex; align-items: center; justify-content: center;
    padding: 20px 56px;
  }
  #book { margin: 0 auto; transition: transform .5s ease; }
  .page { background: #fff; }
  .page img { width: 100%; height: 100%; display: block; object-fit: contain; pointer-events: none; }
  .page.--left  { box-shadow: inset -12px 0 18px -12px rgba(0,0,0,.35); }
  .page.--right { box-shadow: inset 12px 0 18px -12px rgba(0,0,0,.35); }
  .page .shade { position: absolute; inset: 0; pointer-events: none; }
  .page.--left  .shade { background: linear-gradient(to left, rgba(0,0,0,.18), transparent 6%); }
  .page.--right .shade { background: linear-gradient(to right, rgba(0,0,0,.18), transparent 6%); }

  .side-btn {
    position: fixed; top: 50%; transform: translateY(-50%);
    width: 44px; height: 88px; border: 0; border-radius: 8px;
    background: rgba(0,0,0,.25); color: var(--fg); font-size: 26px; cursor: pointer; z-index: 10;
  }
  .side-btn:hover { background: rgba(0,0,0,.5); }
  #prevSide { left: 6px; } #nextSide { right: 6px; }

  footer {
    position: fixed; inset: auto 0 0 0; height: 56px;
    display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px;
    background: var(--bar); border-top: 1px solid var(--line); z-index: 20;
  }
  button.tb {
    min-width: 40px; height: 38px; padding: 0 10px; border: 1px solid transparent; border-radius: 8px;
    background: transparent; color: var(--fg); font-size: 17px; cursor: pointer;
  }
  button.tb:hover { background: rgba(255,255,255,.1); }
  button.tb.on { background: rgba(255,255,255,.16); border-color: var(--line); }
  .sep { width: 1px; height: 24px; background: var(--line); margin: 0 6px; }
  .pageinfo { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .pageinfo input {
    width: 62px; height: 32px; text-align: center; font: inherit; color: var(--fg);
    background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 6px;
  }
  #progress { position: fixed; left: 0; bottom: 56px; height: 3px; background: var(--accent); z-index: 21; transition: width .3s; }

  /* Mục lục ảnh nhỏ */
  #thumbs {
    position: fixed; top: 48px; bottom: 56px; left: 0; width: 230px;
    background: var(--bar); border-right: 1px solid var(--line);
    overflow-y: auto; padding: 12px; z-index: 15;
    transform: translateX(-100%); transition: transform .25s;
  }
  #thumbs.open { transform: none; }
  #thumbs a { display: block; margin-bottom: 12px; color: var(--muted); text-align: center; font-size: 12px; text-decoration: none; cursor: pointer; }
  #thumbs img { width: 100%; display: block; border: 2px solid transparent; border-radius: 3px; background: #fff; aspect-ratio: var(--ratio); }
  #thumbs a.cur img { border-color: var(--accent); }
  #thumbs a.cur { color: var(--fg); }

  /* Phóng to */
  #zoom {
    position: fixed; inset: 0; z-index: 50; background: rgba(10,10,12,.96);
    display: none; overflow: auto; cursor: grab;
  }
  #zoom.open { display: block; }
  #zoom.drag { cursor: grabbing; }
  #zoom .wrap { display: flex; gap: 4px; padding: 60px 20px 20px; width: max-content; min-width: 100%; justify-content: center; }
  #zoom img { display: block; background: #fff; }
  #zoomBar {
    position: fixed; top: 10px; right: 12px; z-index: 51; display: none; gap: 4px;
    background: var(--bar); border: 1px solid var(--line); border-radius: 10px; padding: 4px;
  }
  #zoom.open + #zoomBar { display: flex; }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); z-index: 5; }

  @media (max-width: 700px) {
    #stage { padding: 10px 8px; }
    .side-btn { display: none; }
    .hide-sm { display: none; }
    button.tb { min-width: 36px; padding: 0 6px; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Lật sách</h1>
  <button class="tb" id="btnDownload" title="Tải PDF gốc" hidden>⤓</button>
</header>

<div id="loading">Đang tải sách…</div>
<div id="stage"><div id="book"></div></div>
<button class="side-btn" id="prevSide" title="Trang trước (←)">‹</button>
<button class="side-btn" id="nextSide" title="Trang sau (→)">›</button>

<nav id="thumbs"></nav>

<div id="progress"></div>
<footer>
  <button class="tb" id="btnThumbs" title="Danh sách trang">☰</button>
  <div class="sep hide-sm"></div>
  <button class="tb hide-sm" id="btnFirst" title="Trang đầu (Home)">⏮</button>
  <button class="tb" id="btnPrev" title="Trang trước (←)">◀</button>
  <div class="pageinfo">
    <input id="pageInput" inputmode="numeric" aria-label="Số trang">
    <span id="pageTotal">/ 0</span>
  </div>
  <button class="tb" id="btnNext" title="Trang sau (→)">▶</button>
  <button class="tb hide-sm" id="btnLast" title="Trang cuối (End)">⏭</button>
  <div class="sep hide-sm"></div>
  <button class="tb" id="btnZoom" title="Phóng to trang (Z hoặc nháy đúp)">🔍</button>
  <button class="tb" id="btnSound" title="Âm thanh lật trang">🔊</button>
  <button class="tb" id="btnFull" title="Toàn màn hình (F)">⛶</button>
</footer>

<div id="zoom"><div class="wrap" id="zoomWrap"></div></div>
<div id="zoomBar">
  <button class="tb" id="zOut" title="Thu nhỏ (-)">−</button>
  <button class="tb" id="zFit" title="Vừa màn hình (0)">⤢</button>
  <button class="tb" id="zIn" title="Phóng to (+)">+</button>
  <button class="tb" id="zClose" title="Đóng (Esc)">✕</button>
</div>

<script src="book.js"></script>
<script src="vendor/page-flip.browser.js"></script>
<script>
(() => {
  const BOOK = window.BOOK;
  const N = BOOK.pages.length;
  const LABELS = BOOK.labels || BOOK.pages.map((_, i) => String(i + 1));
  const lastLabel = [...LABELS].reverse().find((l) => /^\d+$/.test(l)) || N;
  const $ = (id) => document.getElementById(id);
  const ratio = BOOK.width / BOOK.height;
  document.title = BOOK.title;
  $('title').textContent = BOOK.title;
  $('pageTotal').textContent = '/ ' + lastLabel;
  document.documentElement.style.setProperty('--ratio', ratio);
  if (BOOK.pdf) { const b = $('btnDownload'); b.hidden = false; b.onclick = () => location.href = BOOK.pdf; }

  // ---- Tạo trang (ảnh nạp lười quanh trang hiện tại) ----
  const bookEl = $('book');
  const imgs = [];
  BOOK.pages.forEach((name, i) => {
    const p = document.createElement('div');
    p.className = 'page';
    // Bìa trước & bìa sau dạng cứng
    if (i === 0 || i === N - 1) p.dataset.density = 'hard';
    const img = document.createElement('img');
    img.alt = 'Trang ' + (i + 1);
    img.decoding = 'async';
    img.dataset.src = 'pages/' + name;
    imgs.push(img);
    p.append(img);
    const shade = document.createElement('div'); shade.className = 'shade'; p.append(shade);
    bookEl.append(p);
  });
  function ensureLoaded(idx) {
    for (let i = idx - 3; i <= idx + 5; i++) {
      const im = imgs[i];
      if (im && !im.src) im.src = im.dataset.src;
    }
  }

  // ---- Kích thước sách vừa khung ----
  const stage = $('stage');
  function fitSize() {
    const cs = getComputedStyle(stage);
    const w = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const h = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const spread = w / h > ratio * 1.25; // đủ rộng để hiện 2 trang
    let pw = spread ? w / 2 : w, ph = pw / ratio;
    if (ph > h) { ph = h; pw = ph * ratio; }
    return { pw: Math.floor(pw), ph: Math.floor(ph), spread };
  }

  let flip, layoutKey;
  const startPage = Math.min(N - 1, Math.max(0, (parseInt(new URLSearchParams(location.hash.slice(1)).get('p')) || 1) - 1));

  function build(page) {
    const { pw, ph, spread } = fitSize();
    layoutKey = spread + ':' + pw + 'x' + ph;
    if (flip) { flip.destroy(); }
    // destroy() xoá phần tử gốc -> tạo lại
    let el = $('book');
    if (!el) { el = document.createElement('div'); el.id = 'book'; stage.append(el); }
    if (!el.children.length) pagesCache.forEach((p) => el.append(p));
    el.style.width = (spread ? pw * 2 : pw) + 'px';
    el.style.height = ph + 'px';

    flip = new St.PageFlip(el, {
      width: pw, height: ph,
      size: 'fixed',
      showCover: true,
      usePortrait: !spread,
      maxShadowOpacity: 0.5,
      mobileScrollSupport: false,
      flippingTime: 700,
      startPage: page,
      autoSize: false,
      drawShadow: true,
    });
    if (spread) flip.getSettings().usePortrait = false;
    flip.loadFromHTML(el.querySelectorAll('.page'));
    flip.on('flip', (e) => { onPage(e.data); playSound(); });
    flip.on('changeOrientation', () => onPage(flip.getCurrentPageIndex()));
    onPage(flip.getCurrentPageIndex());
  }
  const pagesCache = Array.from(bookEl.children);

  // ---- Trạng thái trang ----
  function visiblePages(idx) {
    // Trả về các chỉ số trang đang hiển thị (1 hoặc 2 trang)
    if (!flip || flip.getOrientation() === 'portrait') return [idx];
    if (idx === 0) return [0];
    const left = idx % 2 === 1 ? idx : idx - 1;
    return left + 1 < N ? [left, left + 1] : [left];
  }
  function onPage(idx) {
    ensureLoaded(idx);
    const vis = visiblePages(idx);
    // Căn giữa khi chỉ có bìa trước / bìa sau
    const el = $('book');
    let shift = 0;
    if (flip && flip.getOrientation() !== 'portrait' && vis.length === 1) shift = vis[0] === 0 ? -0.25 : 0.25;
    if (el) el.style.transform = shift ? `translateX(${shift * 100}%)` : '';
    $('pageInput').value = vis.map((i) => LABELS[i]).filter(Boolean).join('-');
    $('progress').style.width = ((vis[vis.length - 1] + 1) / N * 100) + '%';
    history.replaceState(null, '', '#p=' + (idx + 1));
    document.querySelectorAll('#thumbs a').forEach((a, i) => a.classList.toggle('cur', vis.includes(i)));
    const cur = document.querySelector('#thumbs a.cur');
    if (cur && $('thumbs').classList.contains('open')) cur.scrollIntoView({ block: 'nearest' });
    $('loading').style.display = 'none';
  }

  // ---- Điều hướng ----
  const next = () => flip.flipNext();
  const prev = () => flip.flipPrev();
  const go = (i) => { i = Math.max(0, Math.min(N - 1, i)); ensureLoaded(i); flip.turnToPage(i); onPage(i); };
  $('btnNext').onclick = $('nextSide').onclick = next;
  $('btnPrev').onclick = $('prevSide').onclick = prev;
  $('btnFirst').onclick = () => go(0);
  $('btnLast').onclick = () => go(N - 1);
  $('pageInput').addEventListener('focus', (e) => e.target.select());
  $('pageInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const v = e.target.value.trim();
      const i = LABELS.indexOf(String(parseInt(v) || v));
      if (i >= 0) go(i); else onPage(flip.getCurrentPageIndex());
      e.target.blur();
    }
  });

  // ---- Danh sách trang ----
  const thumbs = $('thumbs');
  BOOK.pages.forEach((name, i) => {
    const a = document.createElement('a');
    const im = document.createElement('img');
    im.loading = 'lazy'; im.src = 'thumbs/' + name; im.alt = '';
    a.append(im, document.createTextNode(LABELS[i] || ' '));
    a.onclick = () => { go(i); if (innerWidth < 700) toggleThumbs(false); };
    thumbs.append(a);
  });
  function toggleThumbs(force) {
    const open = thumbs.classList.toggle('open', force);
    $('btnThumbs').classList.toggle('on', open);
    if (open) { const c = thumbs.querySelector('a.cur'); c && c.scrollIntoView({ block: 'center' }); }
  }
  $('btnThumbs').onclick = () => toggleThumbs();

  // ---- Phóng to ----
  const zoom = $('zoom'), zoomWrap = $('zoomWrap');
  let zScale = 1, zFitW = 0;
  function openZoom(idxs) {
    idxs = idxs || visiblePages(flip.getCurrentPageIndex());
    zoomWrap.innerHTML = '';
    idxs.forEach((i) => { const im = document.createElement('img'); im.src = imgs[i].dataset.src; zoomWrap.append(im); });
    zoom.classList.add('open');
    // Vừa chiều cao màn hình
    zFitW = Math.min((innerWidth - 40) / idxs.length, (innerHeight - 80) * ratio);
    setZoom(1.6);
  }
  function setZoom(s, cx, cy) {
    const prevW = zFitW * zScale;
    zScale = Math.max(0.5, Math.min(5, s));
    const w = zFitW * zScale;
    // giữ điểm dưới chuột cố định khi phóng
    cx = cx ?? innerWidth / 2; cy = cy ?? innerHeight / 2;
    const fx = (zoom.scrollLeft + cx) / (zoom.scrollWidth || 1), fy = (zoom.scrollTop + cy) / (zoom.scrollHeight || 1);
    zoomWrap.querySelectorAll('img').forEach((im) => { im.style.width = w + 'px'; im.style.height = (w / ratio) + 'px'; });
    if (prevW) { zoom.scrollLeft = fx * zoom.scrollWidth - cx; zoom.scrollTop = fy * zoom.scrollHeight - cy; }
  }
  const closeZoom = () => zoom.classList.remove('open');
  $('btnZoom').onclick = () => openZoom();
  $('zIn').onclick = () => setZoom(zScale * 1.25);
  $('zOut').onclick = () => setZoom(zScale / 1.25);
  $('zFit').onclick = () => setZoom(1);
  $('zClose').onclick = closeZoom;
  stage.addEventListener('dblclick', () => openZoom());
  zoom.addEventListener('wheel', (e) => {
    if (e.ctrlKey || e.metaKey || !e.shiftKey) { e.preventDefault(); setZoom(zScale * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY); }
  }, { passive: false });
  // Kéo để di chuyển
  let drag = null;
  zoom.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, l: zoom.scrollLeft, t: zoom.scrollTop, moved: false }; zoom.classList.add('drag'); });
  addEventListener('pointermove', (e) => {
    if (!drag) return;
    if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 4) drag.moved = true;
    zoom.scrollLeft = drag.l - (e.clientX - drag.x); zoom.scrollTop = drag.t - (e.clientY - drag.y);
  });
  addEventListener('pointerup', () => { drag = null; zoom.classList.remove('drag'); });
  zoom.addEventListener('dblclick', closeZoom);

  // ---- Âm thanh lật trang (tạo bằng WebAudio, không cần file) ----
  let soundOn = true, actx;
  try { soundOn = localStorage.getItem('flipSound') !== '0'; } catch (e) {}
  const syncSoundBtn = () => { $('btnSound').textContent = soundOn ? '🔊' : '🔇'; };
  syncSoundBtn();
  $('btnSound').onclick = () => { soundOn = !soundOn; syncSoundBtn(); try { localStorage.setItem('flipSound', soundOn ? '1' : '0'); } catch (e) {} };
  function playSound() {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const len = actx.sampleRate * 0.35, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) { const t = i / len; d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.2) * Math.sin(Math.PI * Math.min(1, t * 6)); }
      const src = actx.createBufferSource(); src.buffer = buf;
      const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 0.6;
      const g = actx.createGain(); g.gain.value = 0.25;
      src.connect(f).connect(g).connect(actx.destination); src.start();
    } catch (e) {}
  }

  // ---- Toàn màn hình ----
  $('btnFull').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();

  // ---- Phím tắt ----
  addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (zoom.classList.contains('open')) {
      if (e.key === 'Escape') closeZoom();
      else if (e.key === '+' || e.key === '=') setZoom(zScale * 1.25);
      else if (e.key === '-') setZoom(zScale / 1.25);
      else if (e.key === '0') setZoom(1);
      return;
    }
    switch (e.key) {
      case 'ArrowRight': case 'PageDown': case ' ': e.preventDefault(); next(); break;
      case 'ArrowLeft': case 'PageUp': e.preventDefault(); prev(); break;
      case 'Home': go(0); break;
      case 'End': go(N - 1); break;
      case 'f': case 'F': $('btnFull').click(); break;
      case 'z': case 'Z': openZoom(); break;
      case 'Escape': toggleThumbs(false); break;
    }
  });

  // ---- Đổi kích thước cửa sổ -> dựng lại sách ----
  let rt;
  addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      const { pw, ph, spread } = fitSize();
      if (spread + ':' + pw + 'x' + ph !== layoutKey) build(flip.getCurrentPageIndex());
    }, 200);
  });

  ensureLoaded(startPage);
  build(startPage);
})();
</script>
</body>
</html>
